<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioSyn · Organograma</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #08111F;
  color: #fff;
  min-height: 100vh;
  padding: 32px 24px 80px;
  overflow-x: auto;
}
header { text-align:center; margin-bottom:40px; }
header .ey { font-size:11px; font-weight:700; letter-spacing:3px; color:#0088CB; text-transform:uppercase; margin-bottom:8px; }
header h1  { font-size:24px; font-weight:700; }
header p   { font-size:12px; color:#456; margin-top:6px; }

/* wrapper central */
.org { display:flex; flex-direction:column; align-items:center; }

/* cada item */
.item { display:flex; flex-direction:column; align-items:center; }

/* linha vertical */
.vl { width:2px; height:20px; background:#1E3A5A; }

/* linha horizontal sobre os filhos */
.row-wrap { position:relative; }
.row-wrap::before {
  content:'';
  position:absolute;
  top:0; left:50px; right:50px;
  height:2px; background:#1E3A5A;
}

/* filhos lado a lado */
.row {
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

/* nó */
.node {
  padding:10px 14px;
  border-radius:8px;
  border:1.5px solid rgba(255,255,255,.06);
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  width:190px;
  user-select:none;
}
.node:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.5); }

.nh { display:flex; align-items:center; gap:7px; }
.dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.nt  { font-size:12px; font-weight:600; color:#fff; flex:1; line-height:1.2; }
.arr { font-size:9px; color:rgba(255,255,255,.3); transition:transform .2s; flex-shrink:0; }
.item.op > .item-body > .node .arr { transform:rotate(90deg); }
.ns  { font-size:10px; color:rgba(255,255,255,.4); margin-top:3px; padding-left:16px; line-height:1.3; }
.nhex{
  font-size:9px; font-family:monospace;
  margin-top:4px; margin-left:16px;
  padding:1px 6px; border-radius:3px; display:inline-block;
}
.bdg{
  font-size:8px; font-weight:700; letter-spacing:1px;
  padding:1px 4px; border-radius:3px;
  background:#5BBD2A22; color:#5BBD2A; border:1px solid #5BBD2A44;
  margin-left:4px;
}

/* tipos */
.node.root     { background:#052050; border-color:#0088CB; width:260px; padding:14px 20px; }
.node.root .nt { font-size:15px; }
.node.grp      { background:#0A1628; border-color:#0088CB22; width:220px; }
.node.int      { background:#0D1A2E; }
.node.com      { background:#0D1A2E; }
.node.sub      { background:#061F18; }
.node.prd      { background:#110E00; border-color:#EF9F2722; }
.node.pitm     { background:#0A0900; }
.node.pprd     { background:#130600; }
.node.nux      { background:#041918; }

/* ocultar filhos por padrão */
.item-kids { display:none; flex-direction:column; align-items:center; }
.item.op > .item-kids { display:flex; }
</style>
</head>
<body>

<header>
  <div class="ey">Governança de Marca</div>
  <h1>BioSyn Saúde Animal</h1>
  <p>Clique em qualquer bloco para expandir ou recolher</p>
</header>

<div class="org" id="root"></div>

<script>
const D = {
  l:'BioSyn Saúde Animal', s:'Marca mãe · Nutrição Inteligente', t:'root', c:'#0088CB',
  kids:[
    { l:'Programas Internos', s:'Time interno · desenvolvimento e comunicação', t:'grp', c:'#0088CB',
      kids:[
        {l:'Onboarding',          s:'Integração · novos colaboradores',                       t:'int', c:'#868688'},
        {l:'Academia BioSyn',     s:'Plataforma online · cursos',                             t:'int', c:'#FFFFFF'},
        {l:'Academia de Líderes', s:'Liderança · presencial',                                 t:'int', c:'#6B2D8B'},
        {l:'Fala BioSyn',         s:'Canal único de comunicação interna · e-mail + WhatsApp', t:'int', c:'#0088CB'},
      ]
    },
    { l:'Programas Comerciais', s:'Canal externo · distribuidores e representantes', t:'grp', c:'#F7941D',
      kids:[
        {l:'Ponto a Ponto', s:'Encontros periódicos · online',   t:'com', c:'#00B050'},
        {l:'Valoriza+',     s:'Incentivo de vendas · premiação',  t:'com', c:'#F7941D'},
      ]
    },
    { l:'Submarcas', s:'Identidades próprias no ecossistema BioSyn', t:'grp', c:'#1D9E75',
      kids:[
        { l:'NUXCELL', s:'Pet · animais de companhia', t:'sub', c:'#089CA3',
          kids:[
            {l:'NuxLovers',     s:'Programa de influência',        t:'int', c:'#089CA3'},
            {l:'Nuxcell Plus',  s:'Cães e gatos · todas as fases', t:'nux', c:'#BA1FB5'},
            {l:'Nuxcell Fel',   s:'Gatos · específico',            t:'nux', c:'#008A80'},
            {l:'Nuxcell NEO',   s:'Filhotes e mães',               t:'nux', c:'#F7A30A'},
            {l:'Nuxcell Pufa',  s:'Pele e pelagem',                t:'nux', c:'#1B4E8F'},
            {l:'Nuxcell Pulse', s:'Energia e músculos', b:'NOVO',  t:'nux', c:'#089CA3'},
            {l:'Nuxcell Fit',   s:'Condição corporal',  b:'NOVO',  t:'nux', c:'#089CA3'},
            {l:'Nuxcell Move',  s:'Articulações',       b:'NOVO',  t:'nux', c:'#089CA3'},
          ]
        },
        { l:'MicroCaps', s:'Ingredientes · microencapsulamento', t:'sub', c:'#0096D6',
          kids:[{l:'Tecnologia MicroCaps', s:'Sacch · B.subtilis · L.acidophilus', t:'pitm', c:'#0096D6'}]
        },
        { l:'BioAgrega', s:'Agricultura · a desenvolver', t:'sub', c:'#1D9E75',
          kids:[{l:'Produtos e programas', s:'A definir', t:'pitm', c:'#1D9E75'}]
        },
      ]
    },
    { l:'Animais de Produção', s:'Linhas de produto por espécie', t:'prd', c:'#EF9F27',
      kids:[
        { l:'Aves', s:'6 produtos', t:'prd', c:'#EF9F27',
          kids:[
            {l:'NeoFlora HATCH',  s:'Aditivo probiótico · incubatório', t:'pitm', c:'#5BBD2A'},
            {l:'MAN Acid Plus-W', s:'Simbiótico + ácidos orgânicos',    t:'pitm', c:'#6B2D8B'},
            {l:'AMA',             s:'Advanced Microflora Additive',     t:'pitm', c:'#E8572A'},
            {l:'BioHidract',      s:'Suplemento hidrossolúvel',         t:'pitm', c:'#FDB913'},
            {l:'MAN Acid Plus',   s:'Simbiótico + ácidos orgânicos',    t:'pitm', c:'#6B2D8B'},
            {l:'NeoFlora',        s:'Aditivo probiótico',               t:'pitm', c:'#007A3D'},
          ]
        },
        { l:'Suínos', s:'5 produtos', t:'prd', c:'#EF9F27',
          kids:[
            {l:'BioHidract',      s:'Suplemento hidrossolúvel',        t:'pitm', c:'#FDB913'},
            {l:'MAN Acid Plus',   s:'Simbiótico + ácidos orgânicos',   t:'pitm', c:'#6B2D8B'},
            {l:'PROLIFE REXX',    s:'Suplemento energético',           t:'pitm', c:'#9E1F9E'},
            {l:'AMA',             s:'Advanced Microflora Additive',    t:'pitm', c:'#E8572A'},
            {l:'MAN Acid Plus-W', s:'Simbiótico + ácidos orgânicos',   t:'pitm', c:'#6B2D8B'},
          ]
        },
        { l:'Bovinos', s:'3 produtos', t:'prd', c:'#EF9F27',
          kids:[
            {l:'Probisyn',              s:'Probiótico bovinos',  t:'pitm', c:'#C01E2E'},
            {l:'PLUS Advantage Bov.',   s:'Suplemento bovinos', t:'pitm', c:'#0096D6'},
            {l:'PLUS Advantage Multi',  s:'Multiespécies',      t:'pitm', c:'#F7941D'},
          ]
        },
        { l:'Piscicultura', s:'1 produto', t:'prd', c:'#EF9F27',
          kids:[{l:'Add Life PRO Sacch', s:'Aditivo probiótico · peixes', t:'pitm', c:'#0096D6'}]
        },
        { l:'Programas de Produto', s:'PIE + PR · multiespécies', t:'prd', c:'#EF9F27',
          kids:[
            {l:'PIE', s:'Integridade Elevada · Aves + Suínos', t:'pprd', c:'#E8572A'},
            {l:'PR',  s:'Reprodutivo · Fêmeas',                t:'pprd', c:'#C01E2E'},
          ]
        },
      ]
    },
  ]
};

function mk(d, depth) {
  const hasK = d.kids && d.kids.length > 0;
  const item = document.createElement('div');
  item.className = 'item' + (depth === 0 ? ' op' : '');

  // body = vline topo + node + vline base
  const body = document.createElement('div');
  body.className = 'item-body';
  body.style.cssText = 'display:flex;flex-direction:column;align-items:center;';

  if (depth > 0) { const v=document.createElement('div'); v.className='vl'; body.appendChild(v); }

  // node
  const node = document.createElement('div');
  node.className = 'node ' + d.t;
  node.style.borderColor = d.c + '55';

  const nh = document.createElement('div'); nh.className = 'nh';
  const dot = document.createElement('div'); dot.className = 'dot'; dot.style.background = d.c;
  const nt = document.createElement('div'); nt.className = 'nt'; nt.textContent = d.l;
  if (d.b) { const bdg=document.createElement('span'); bdg.className='bdg'; bdg.textContent=d.b; nt.appendChild(bdg); }
  nh.appendChild(dot); nh.appendChild(nt);
  if (hasK) { const arr=document.createElement('span'); arr.className='arr'; arr.textContent='▶'; nh.appendChild(arr); }
  node.appendChild(nh);

  if (d.s) { const ns=document.createElement('div'); ns.className='ns'; ns.textContent=d.s; node.appendChild(ns); }

  if (d.t !== 'root' && d.t !== 'grp') {
    const hx=document.createElement('div'); hx.className='nhex';
    hx.style.cssText=`background:${d.c}18;color:${d.c==='#FFFFFF'?'#aaa':d.c};border:1px solid ${d.c}33`;
    hx.textContent=d.c; node.appendChild(hx);
  }

  body.appendChild(node);

  if (hasK) {
    const vb=document.createElement('div'); vb.className='vl'; body.appendChild(vb);
  }

  item.appendChild(body);

  // kids
  if (hasK) {
    const kids = document.createElement('div');
    kids.className = 'item-kids';
    const rowWrap = document.createElement('div'); rowWrap.className = 'row-wrap';
    const row = document.createElement('div'); row.className = 'row';
    d.kids.forEach(k => row.appendChild(mk(k, depth+1)));
    rowWrap.appendChild(row);
    kids.appendChild(rowWrap);
    item.appendChild(kids);

    node.addEventListener('click', e => { e.stopPropagation(); item.classList.toggle('op'); });
  }

  return item;
}

document.getElementById('root').appendChild(mk(D, 0));
</script>
</body>
</html>
